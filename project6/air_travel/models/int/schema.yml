version: 2

models:
  - name: Country
    config:
      contract:
        enforced: true
    columns:
      - name: name
        data_type: string
        constraints:
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: iso_code
        data_type: string
      - name: dafif_codes
        data_type: array<string>
      - name: _data_source
        data_type: string
      - name: _load_time
        data_type: timestamp
  - name: Flight_Delays
    config:
        contract:
          enforced: true
    constraints:
        - type: primary_key
          columns: [event_month, airline_id, airport_icao]
    columns:
        - name: event_month
          data_type: date
        - name: airline_id
          data_type: int64
          constraints:
            - type: foreign_key
              to: ref('Airline')
              to_columns: [id]
          tests:
            - relationships:
                to: ref('Airline')
                field: id
            - not_null
        - name: airport_icao
          data_type: string
          constraints:
            - type: foreign_key
              to: ref('Airport')
              to_columns: [icao]
          tests:
            - relationships:
                to: ref('Airport')
                field: icao
            - not_null
        - name: arr_total
          data_type: int64
        - name: arr_cancelled
          data_type: int64
        - name: arr_diverted
          data_type: int64
        - name: arr_delay_min
          data_type: int64
        - name: weather_delay_min
          data_type: int64
        - name: nas_delay_min
          data_type: int64
        - name: late_aircraft_delay_min
          data_type: int64
        - name: _data_source
          data_type: string
        - name: _load_time
          data_type: timestamp
    tests:
        - unique_combination_of_columns: 
            combination_of_columns:
              - event_month
              - airline_id
              - airport_icao
  - name: TSA_Traffic
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [event_date, event_hour, airport_icao, tsa_checkpoint]
    columns:
      - name: event_date
        data_type: date
        tests:
          - not_null
      - name: event_hour
        data_type: int64
        tests:
          - not_null
      - name: airport_icao
        data_type: string
        constraints:
          - type: foreign_key
            to: ref('Airport')
            to_columns: [icao]
        tests:
          - not_null
      - name: tsa_checkpoint
        data_type: string
      - name: passenger_count
        data_type: int64
        tests:
          - not_null
      - name: _data_source
        data_type: string
      - name: _load_time
        data_type: timestamp
    tests:
      - unique_combination_of_columns: 
          combination_of_columns:
            - event_date
            - event_hour
            - airport_icao
            - tsa_checkpoint